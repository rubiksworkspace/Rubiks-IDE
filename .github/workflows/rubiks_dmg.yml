# Builds and publishes the Rubiks IDE DMG for Apple silicon on every push to
# main (and by hand from the Actions tab). Each build gets its own version,
# <major>.<minor>.<build number> (major and minor from crates/zed/Cargo.toml,
# the build number from this workflow's run number), stamped into the app
# before the build, and a run from main publishes it as a GitHub release
# tagged v<version>, marked latest. The newest DMG is always at:
#   https://github.com/<owner>/<repo>/releases/latest/download/Rubiks-IDE-aarch64.dmg
# The IDE checks that release every hour and updates itself (crates/auto_update).
# Older releases stay listed, so the version history is visible.
#
# The DMG is not notarized (there is no Apple Developer certificate), so
# macOS blocks the first launch: right-click Rubiks IDE → Open, or run
#   xattr -dr com.apple.quarantine "/Applications/Rubiks IDE.app"
name: Rubiks IDE release

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push makes an older build pointless: cancel it.
concurrency:
  group: rubiks-ide-dmg-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # creates the release

jobs:
  dmg:
    name: Build DMG (Apple silicon)
    runs-on: macos-15
    timeout-minutes: 330
    env:
      # The shareable build; local development keeps crates/zed/RELEASE_CHANNEL.
      ZED_RELEASE_CHANNEL: stable
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      # The release profile builds most crates as one codegen unit with debug
      # info, which is slow and memory-hungry on the hosted runner (3 cores,
      # 7 GB). This build is for sharing, not for crash symbolication.
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h /
          # SDKs this build never uses; any that are missing are skipped.
          sudo rm -rf "${ANDROID_HOME:-/nonexistent}" "$HOME/.dotnet" /usr/local/share/dotnet || true
          df -h /

      - name: Install the Rust toolchain
        # rust-toolchain.toml pins the version, components and targets.
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin
          rustc --version

      - name: Cache cargo registry and tools
        uses: Swatinem/rust-cache@v2
        with:
          # The release target directory is far over the cache size limit.
          cache-targets: "false"

      - name: Pick the version
        id: version
        run: |
          base="$(sed -n 's/^version *= *"\([0-9]*\.[0-9]*\)\..*/\1/p' crates/zed/Cargo.toml | head -1)"
          test -n "$base"
          version="${base}.${GITHUB_RUN_NUMBER}"
          echo "Version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Stamp the version into the app
        # The app reports its crate version (and the bundle's Info.plist
        # carries it); cargo updates Cargo.lock to match at build time.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import os, re
          path = "crates/zed/Cargo.toml"
          text = open(path).read()
          text, count = re.subn(r'(?m)^version = "[^"]+"', f'version = "{os.environ["VERSION"]}"', text, count=1)
          assert count == 1, "no version in crates/zed/Cargo.toml"
          open(path, "w").write(text)
          PY
          grep -n -m1 '^version' crates/zed/Cargo.toml

      - name: Build the DMG
        run: script/bundle-mac aarch64-apple-darwin

      - name: Locate the DMG
        id: dmg
        run: |
          dmg="target/aarch64-apple-darwin/release/Rubiks-IDE-aarch64.dmg"
          test -f "$dmg"
          ls -lh "$dmg"
          echo "path=$dmg" >> "$GITHUB_OUTPUT"

      - name: Upload the DMG as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rubiks-IDE-aarch64-${{ steps.version.outputs.version }}
          path: ${{ steps.dmg.outputs.path }}
          retention-days: 30
          if-no-files-found: error

      - name: Publish the release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          DMG: ${{ steps.dmg.outputs.path }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v${VERSION}" "$DMG" \
            --target "$GITHUB_SHA" \
            --latest \
            --title "Rubiks IDE ${VERSION}" \
            --notes "Built from ${GITHUB_SHA}. Apple silicon only.

          Download Rubiks-IDE-aarch64.dmg, open it and drag Rubiks IDE to Applications. It is not notarized: on first launch right-click Rubiks IDE → Open (or run \`xattr -dr com.apple.quarantine \"/Applications/Rubiks IDE.app\"\`). Once installed, the IDE checks for new releases every hour and updates itself."
          # The rolling pre-release this workflow used to publish.
          gh release delete ide-latest --yes --cleanup-tag || true
